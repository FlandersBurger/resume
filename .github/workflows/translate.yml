name: Translate

on:
  push:
    branches: [master]
    paths:
      - "data/locales/master/**"
  # Rerun by hand after fixing a translation the verify step rejected; a failed run commits nothing.
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to start the Build that deploys the translations

env:
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_MASTER_CHAT: ${{ secrets.TELEGRAM_MASTER_CHAT }}

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "26"

      - name: Install dependencies
        run: npm install

      - name: Translate locales
        env:
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: |
          cd src/scripts
          node i18n-scanner.js en ar de es fr hi id ja ko nl pt ru tl

      - name: Verify translations
        run: npm run translate:verify

      - name: Commit translations
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/locales/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update translations [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git push

      # A push by Actions doesn't start the Build, so the translations would wait for the next deploy.
      - name: Deploy translations
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref master -f reason="Deploy translations"

      - name: Notify Telegram on failure
        if: failure()
        uses: ./.github/actions/telegram-notify
        with:
          text: "❌ Translation failed\n<a href='https://github.com/${{ github.repository }}/commit/${{ github.sha }}'>${{ github.sha }}</a>"
